apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  config.yaml: |-
{{ toYaml .Values.config | indent 4 }}

--- 
{{ if .Values.monitoringConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-monitoring
data:
  config.yaml: |-
{{ toYaml .Values.monitoringConfig | indent 4 }}
{{ end }}