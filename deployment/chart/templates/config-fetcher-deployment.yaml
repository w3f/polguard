{{- if .Values.configFetcher.repoUrl }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}-config-fetcher
  labels: {{ include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: config-fetcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: config-fetcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: config-fetcher
    spec:
      # git-sync runs as UID 65533; fsGroup makes the mounted SSH key readable and
      # lets it write the shared PVC. See docs/ssh.md in kubernetes/git-sync.
      securityContext:
        fsGroup: 65533
      containers:
        - name: git-sync
          image: {{ .Values.configFetcher.image.repository }}:{{ .Values.configFetcher.image.tag }}
          imagePullPolicy: {{ .Values.configFetcher.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsUser: 65533
          env:
            - name: GITSYNC_REPO
              value: {{ .Values.configFetcher.repoUrl | quote }}
            - name: GITSYNC_REF
              value: {{ .Values.configFetcher.ref | default "main" | quote }}
            - name: GITSYNC_DEPTH
              value: "1"
            - name: GITSYNC_ROOT
              value: /app/monitoring-configs
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_PERIOD
              value: {{ .Values.configFetcher.syncPeriod | default "15m" | quote }}
            - name: GITSYNC_SSH_KEY_FILE
              value: /etc/git-secret/ssh
            - name: GITSYNC_SSH_KNOWN_HOSTS
              value: "true"
            - name: GITSYNC_SSH_KNOWN_HOSTS_FILE
              value: /etc/git-secret-known-hosts/known_hosts
            {{- if .Values.configFetcher.sparseCheckout }}
            - name: GITSYNC_SPARSE_CHECKOUT_FILE
              value: /etc/git-sync/sparse-checkout
            {{- end }}
          volumeMounts:
            - name: monitoring-configs
              mountPath: /app/monitoring-configs
            - name: ssh-key
              mountPath: /etc/git-secret
              readOnly: true
            - name: known-hosts
              mountPath: /etc/git-secret-known-hosts
              readOnly: true
            {{- if .Values.configFetcher.sparseCheckout }}
            - name: sparse-checkout
              mountPath: /etc/git-sync
              readOnly: true
            {{- end }}
      volumes:
        - name: monitoring-configs
          persistentVolumeClaim:
            claimName: {{ include "common.names.fullname" . }}-monitoring-configs
        - name: ssh-key
          secret:
            secretName: {{ include "common.names.fullname" . }}-config-fetcher-ssh
            # 0400 is required: k8s defaults Secret files to 0444, too loose for an SSH key.
            defaultMode: 0400
            items:
              - key: ssh-private-key
                path: ssh
        - name: known-hosts
          configMap:
            name: {{ include "common.names.fullname" . }}-config-fetcher-known-hosts
        {{- if .Values.configFetcher.sparseCheckout }}
        - name: sparse-checkout
          configMap:
            name: {{ include "common.names.fullname" . }}-config-fetcher-sparse
        {{- end }}
{{- end }}
