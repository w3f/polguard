{{- if .Values.payouts.enabled }}
{{/*
    Opt-in payouts job: its rendered config.yaml, plus the CronJob that claims validator rewards.
    It reads the same monitoring-configs PVC the chain services use, so it waits for the
    config-fetcher to populate it before starting.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-payouts
  labels: {{ include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: payouts
data:
  config.yaml: |-
    {{- toYaml .Values.payouts.config | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "common.names.fullname" . }}-payouts
  labels: {{ include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: payouts
spec:
  schedule: {{ .Values.payouts.schedule | quote }}
  # A suspended CronJob never fires on its own, but can still be run on demand with
  # `kubectl create job <name> --from=cronjob/<name>`.
  suspend: {{ .Values.payouts.suspend }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "common.names.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: payouts
          annotations:
            checksum/config: {{ toYaml .Values.payouts.config | sha256sum }}
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: wait-for-monitoring-configs
              image: "busybox:1.28"
              command: ['sh', '-c', 'until ls -d /app/monitoring-configs/*/current >/dev/null 2>&1; do echo waiting for monitoring configs; sleep 2; done;']
              volumeMounts:
                - name: monitoring-configs
                  mountPath: /app/monitoring-configs
                  readOnly: true
          containers:
            - name: {{ include "common.names.fullname" . }}-payouts
              image: {{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}
              imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
              args: ["start:payouts"]
              {{- with .Values.payouts.resources }}
              resources: {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: config
                  mountPath: /app/packages/payouts/config
                  readOnly: true
                - name: monitoring-configs
                  mountPath: /app/monitoring-configs
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: {{ include "common.names.fullname" . }}-payouts
            - name: monitoring-configs
              persistentVolumeClaim:
                claimName: {{ include "common.names.fullname" . }}-monitoring-configs
{{- end }}
