{{- range $repo := .Values.configFetcher.repos }}
{{- if $repo.sshPrivateKeyBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" $ }}-config-fetcher-ssh-{{ $repo.name }}
  labels: {{ include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: config-fetcher
type: Opaque
data:
  ssh-private-key: {{ $repo.sshPrivateKeyBase64 | quote }}
{{- end }}
{{- end }}
