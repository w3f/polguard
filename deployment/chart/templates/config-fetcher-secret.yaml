{{- if .Values.configFetcher.sshPrivateKeyBase64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-config-fetcher-ssh
  labels: {{ include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: config-fetcher
type: Opaque
data:
  ssh-private-key: {{ .Values.configFetcher.sshPrivateKeyBase64 | quote }}
{{- end }}
