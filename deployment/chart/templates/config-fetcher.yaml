{{/*
    The config-fetcher and the volume it fills: the shared monitoring-configs PVC (also mounted by
    every chain service and the payouts job), pinned known_hosts, one SSH key Secret and optional
    sparse-checkout ConfigMap per repo, and the git-sync Deployment that clones into the PVC.
*/}}
{{ $context := dict "name" "monitoring-configs" "persistence" $.Values.configFetcher.persistence "global" $ }}
{{ include "polguard.pvc" $context }}
---
{{- if .Values.configFetcher.knownHosts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-config-fetcher-known-hosts
  labels: {{ include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: config-fetcher
data:
  known_hosts: |
{{ .Values.configFetcher.knownHosts | indent 4 }}
{{- end }}
{{- range $repo := .Values.configFetcher.repos }}
{{- if $repo.sparseCheckout }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" $ }}-config-fetcher-sparse-{{ $repo.name }}
  labels: {{ include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: config-fetcher
data:
  sparse-checkout: |
{{ $repo.sparseCheckout | indent 4 }}
{{- end }}
{{- end }}
{{- range $repo := .Values.configFetcher.repos }}
---
# Rendered for every repo, even without a key: the Deployment below mounts this Secret
# unconditionally, so skipping it would leave the pod stuck on FailedMount instead of
# failing visibly in the git-sync logs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" $ }}-config-fetcher-ssh-{{ $repo.name }}
  labels: {{ include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: config-fetcher
type: Opaque
data:
  ssh-private-key: {{ $repo.sshPrivateKeyBase64 | default "" | quote }}
{{- end }}
---
{{- if .Values.configFetcher.repos }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}-config-fetcher
  labels: {{ include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: config-fetcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: config-fetcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: config-fetcher
    spec:
      # git-sync runs as UID 65533; fsGroup makes the mounted SSH keys readable and
      # lets it write the shared PVC. See docs/ssh.md in kubernetes/git-sync.
      securityContext:
        fsGroup: 65533
      containers:
        {{- range $repo := .Values.configFetcher.repos }}
        - name: git-sync-{{ $repo.name }}
          image: {{ $.Values.configFetcher.image.repository }}:{{ $.Values.configFetcher.image.tag }}
          imagePullPolicy: {{ $.Values.configFetcher.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsUser: 65533
          env:
            - name: GITSYNC_REPO
              value: {{ $repo.url | quote }}
            - name: GITSYNC_REF
              value: {{ $repo.ref | default "main" | quote }}
            - name: GITSYNC_DEPTH
              value: "1"
            - name: GITSYNC_ROOT
              value: /app/monitoring-configs/{{ $repo.name }}
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_PERIOD
              value: {{ $.Values.configFetcher.syncPeriod | default "15m" | quote }}
            - name: GITSYNC_SSH_KEY_FILE
              value: /etc/git-secret/ssh
            - name: GITSYNC_SSH_KNOWN_HOSTS
              value: "true"
            - name: GITSYNC_SSH_KNOWN_HOSTS_FILE
              value: /etc/git-secret-known-hosts/known_hosts
            {{- if $repo.sparseCheckout }}
            - name: GITSYNC_SPARSE_CHECKOUT_FILE
              value: /etc/git-sync/sparse-checkout
            {{- end }}
          volumeMounts:
            - name: monitoring-configs
              mountPath: /app/monitoring-configs
            - name: ssh-key-{{ $repo.name }}
              mountPath: /etc/git-secret
              readOnly: true
            - name: known-hosts
              mountPath: /etc/git-secret-known-hosts
              readOnly: true
            {{- if $repo.sparseCheckout }}
            - name: sparse-checkout-{{ $repo.name }}
              mountPath: /etc/git-sync
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: monitoring-configs
          persistentVolumeClaim:
            claimName: {{ include "common.names.fullname" . }}-monitoring-configs
        - name: known-hosts
          configMap:
            name: {{ include "common.names.fullname" . }}-config-fetcher-known-hosts
        {{- range $repo := .Values.configFetcher.repos }}
        - name: ssh-key-{{ $repo.name }}
          secret:
            secretName: {{ include "common.names.fullname" $ }}-config-fetcher-ssh-{{ $repo.name }}
            # 0400 is required: k8s defaults Secret files to 0444, too loose for an SSH key.
            defaultMode: 0400
            items:
              - key: ssh-private-key
                path: ssh
        {{- if $repo.sparseCheckout }}
        - name: sparse-checkout-{{ $repo.name }}
          configMap:
            name: {{ include "common.names.fullname" $ }}-config-fetcher-sparse-{{ $repo.name }}
        {{- end }}
        {{- end }}
{{- end }}
