{{ if and .Values.prometheusRulesEnabled .Values.chainServices }}
# Metric names and the `chain` label are the ones emitted by ChainTelemetryService;
# `namespace` and `pod` are added by the Prometheus operator when it scrapes the chain ServiceMonitor.
{{- $behindBlocks := .Values.prometheusRuleBehindBlocks | int }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "common.names.fullname" . }}-chain-service-rules
  labels: {{ include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: chain
    {{- with .Values.prometheusRuleLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ChainBlockAlerts
      rules:
        - alert: ProcessingBehindAlert
          expr: "polguard_chain_latest_block_on_chain{namespace=\"{{ .Release.Namespace }}\"} - polguard_chain_last_block_processed{namespace=\"{{ .Release.Namespace }}\"} > {{ $behindBlocks }}"
          for: "5m"
          labels:
            severity: warning
          annotations:
            summary: The last processed block is more than {{ $behindBlocks }} blocks behind the latest block on the chain.
            description: "Chain {{`{{ $labels.chain }}`}} (pod {{`{{ $labels.pod }}`}}): The last processed block is {{`{{ $value }}`}} behind the latest block on the chain."
        - alert: ProcessingStoppedAlert
          expr: "changes(polguard_chain_last_block_processed{namespace=\"{{ .Release.Namespace }}\"}[15m]) == 0"
          # `for` rides out the first scrapes after a restart, when the 15m window holds a single sample.
          for: "5m"
          labels:
            severity: warning
          annotations:
            summary: The chain service has not processed a new block in more than 15 minutes.
            description: "Chain {{`{{ $labels.chain }}`}} (pod {{`{{ $labels.pod }}`}}): The chain service has not processed a new block in more than 15 minutes."
{{- end }}
