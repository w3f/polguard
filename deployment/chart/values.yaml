
# The values in this file provide sensible default for this chart.
# The schema used is defined by ./values.schema.json

# --------------------------------- Global resource settings applied to every service  ---------------------------------

image:
  repository: "docker.io/web3f/monitoring-platform"
  tag: "latest"
  pullPolicy: "IfNotPresent"

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "400m"
    memory: "512Mi"

serviceMonitorsEnabled: true

prometheusRulesEnabled: true

# --------------------------------------------------- Chain services ---------------------------------------------------

# chainServices: # each chain listed here will create a new set of chain svc instances (x replica count)

chainInitContainers:
  - name: "wait-for-monitoring-configs"
    image: "busybox:1.28"
    command: [ 'sh', '-c', 'until [ -f /app/monitoring-configs/current/.checksum ]; do echo waiting for monitoring configs; sleep 2; done;' ]
    volumeMounts:
      - name: monitoring-configs
        mountPath: /app/monitoring-configs
        readOnly: true

# ---------------------------------------------------- Incident service -----------------------------------------------------

# for the default values.yaml file, all fields MUST be provided
incidentService:
  replicas: 1
  containerArgs: ["start:incident"]
  secrets: {} # OPTIONAL secrets map
  config: {}  # REQUIRED runtime configuration
  containerHttpPort: 3000
  serviceHttpPort: 80
  containerMetricsPort: 9464
  serviceMetricsPort: 9464
  resources:
    requests:
      cpu: "400m"
      memory: "512Mi"
    limits:
      cpu: "800m"
      memory: "1024Mi"

incidentInitContainers:
  - name: "wait-for-postgresql"
    image: "busybox:1.28"
    command: [ 'sh', '-c', 'until nc -z postgresql 5432; do echo waiting for postgresql; sleep 2; done;' ]

# --------------------------------------------------- Matrix service ---------------------------------------------------

# for the default values.yaml file, all fields MUST be provided
matrixService:
  replicas: 1
  containerArgs: ["start:matrix"]
  secrets: {} # OPTIONAL secrets map
  config: {}  # REQUIRED runtime configuration
  containerHttpPort: 3000
  serviceHttpPort: 80
  containerMetricsPort: 9464
  serviceMetricsPort: 9464
  persistence:
    # Matrix requires persistent storage for session data and encryption keys
    size: "200Mi"
    accessModes:
      - "ReadWriteOnce"

# ------------------------------------------------ Config fetcher ------------------------------------------------------

configFetcher:
  schedule: "*/15 * * * *"  # Every 15 minutes
  defaultToken: ""  # Optional: default auth token for all sources
  sources: []
    # Example:
    # - name: "polkadot"
    #   url: "https://gitlab.com/path/to/polkadot.yaml"
    #   token: ""  # Optional: override default token for this source
  persistence:
    size: "100Mi"
    accessModes:
      - "ReadWriteMany"  # Required for multiple pods to read
    # storageClass: ""

# ----- the following variables are not part of the schema but are still supported. they come from bitnami/common ------

#fullnameOverride: "monitoring-prod"
# (other variables may be supported)
