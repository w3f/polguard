environments:
  ci:
  local:
  test:

repositories:
- name: w3f
  url: https://w3f.github.io/helm-charts/

releases:

- name: chain-polkadot
  {{ if eq .Environment.Name "test" }}
  namespace: test
  {{ end }}
  chart: ../charts/chain
  values:
  - ./config/chain-polkadot-values.yaml.gotmpl

- name: chain-people-polkadot
  {{ if eq .Environment.Name "test" }}
  namespace: test
  {{ end }}
  chart: ../charts/chain
  values:
  - ./config/chain-people-polkadot-values.yaml.gotmpl
