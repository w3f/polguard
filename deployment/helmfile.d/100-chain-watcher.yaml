environments:
  ci:
  local:
  test:

repositories:
- name: w3f
  url: https://w3f.github.io/helm-charts/

releases:

- name: chain-watcher
  {{ if eq .Environment.Name "test" }}
  namespace: test
  {{ end }}
  chart: ../charts/chain-watcher
  values:
  - ./config/watcher-values.yaml.gotmpl

- name: chain-watcher-people
  {{ if eq .Environment.Name "test" }}
  namespace: test
  {{ end }}
  chart: ../charts/chain-watcher
  values:
  - ./config/watcher-people-values.yaml.gotmpl