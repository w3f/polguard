environments:
  ci:
  local:
  test:

repositories:
- name: w3f
  url: https://w3f.github.io/helm-charts/

releases:

- name: chain-watcher-polkadot
  {{ if eq .Environment.Name "test" }}
  namespace: test
  {{ end }}
  chart: ../charts/watcher
  values:
  - ./config/chain-polkadot-values.yaml.gotmpl

- name: telemetry-watcher-polkadot
  {{ if eq .Environment.Name "test" }}
  namespace: test
  {{ end }}
  chart: ../charts/watcher
  values:
  - ./config/telemetry-polkadot-values.yaml.gotmpl

- name: chain-watcher-people-polkadot
  {{ if eq .Environment.Name "test" }}
  namespace: test
  {{ end }}
  chart: ../charts/watcher
  values:
  - ./config/chain-people-polkadot-values.yaml.gotmpl