tests:
  image:
    repository: web3f/monitoring-platform-e2e
    tag: latest
    pullPolicy: IfNotPresent
  config:
    timeoutSeconds: 120
    api:
      url: http://api:3000
      incident:
        handlerType: TransferEgressEvent
    chain:
      url: http://chain:3000
      targetBlock: 25700136
    matrix:
      homeserver: https://matrix.web3.foundation
      # MonitoringPlatformCI non-encrypted room
      roomId: "!qheQMilERwmQosvZnI:web3.foundation"
      userId: "@cibot:web3.foundation"
      tokenAuth:
        deviceId: YWSWHPBARX
      # accessToken is provided via MATRIX_TOKEN environment variable
      messagePattern: "sent 11.8985 DOT"

# Secrets configuration
secrets:
  MATRIX_TOKEN: ""

postgresql:
  auth:
    enablePostgresUser: true
    postgresPassword: postgres
    database: monitoring
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# API service configuration
api:
  imageTag: latest
  containerArgs: ["start:api"]
  initContainers:
    - name: wait-for-postgresql
      image: busybox:1.28
      command: ['sh', '-c', 'until nc -z postgresql 5432; do echo waiting for postgresql; sleep 2; done;']
  service:
    port: 3000
  mountPaths:
    config: /app/packages/api/config
  config:
    database:
      host: postgresql
      port: 5432
      username: postgres
      password: postgres
      database: monitoring
    notificationApi:
      matrix:
        url: http://matrix:3000/notifications
    monitoringConfigSources:
      - name: gitlab
        # E2E Test project
        url: https://gitlab.w3f.tech/api/v4/projects/101/repository/files/accounts.yaml/raw?ref=main
        # authToken is provided via GITLAB_TOKEN environment variable
    environment: test
    logging:
      level: debug
  secrets:
    GITLAB_TOKEN: ""

# Chain service configuration
chain:
  imageTag: latest
  containerArgs: ["start:chain"]
  initContainers:
    - name: wait-for-api
      image: busybox:1.28
      command: ['sh', '-c', 'until nc -z api 3000; do echo waiting for api; sleep 2; done;']
  service:
    port: 3000
  persistence:
    enabled: true
    size: 50Mi
  mountPaths:
    config: /app/packages/chain/config
    data: /app/packages/chain/data
  config:
    chain: Polkadot
    # Target Event is at block 25700136
    startBlock: 25700135
    rpc: 
      url: wss://rpc-polkadot.luckyfriday.io
    monitoringApi:
      baseUrl: http://api:3000
      endpoints:
        createIncident: /incidents
        resolveIncident: /incidents/:id/resolve
        getConfig: /monitoring-config/groups
        getLastBlock: /last-block/:chain
        setLastBlock: /last-block
    environment: test
    logging:
      level: debug

# Matrix service configuration
matrix:
  imageTag: latest
  containerArgs: ["start:matrix"]
  initContainers:
    - name: wait-for-api
      image: busybox:1.28
      command: ['sh', '-c', 'until nc -z api 3000; do echo waiting for api; sleep 2; done;']
  service:
    port: 3000
  persistence:
    enabled: true
    size: 50Mi
  mountPaths:
    config: /app/packages/matrix/config
    data: /app/packages/matrix/matrix-storage
  config:
    matrix:
      url: https://matrix.web3.foundation
      userId: "@cibot:web3.foundation"
      tokenAuth:
        deviceId: YWSWHPBARX
      # accessToken is provided via MATRIX_TOKEN environment variable
      rooms:
        # MonitoringPlatformCI non-encrypted room
        - id: "!qheQMilERwmQosvZnI:web3.foundation"
      logging:
        level: warn
    monitoringApi:
      baseUrl: http://api:3000
      endpoints:
        getIncidents: /incidents
        getIncident: /incidents/:id
        acknowledgeIncident: /incidents/:id/acknowledge
        getAccounts: /monitoring-config/accounts
    environment: test
    logging:
      level: debug
  secrets:
    MATRIX_TOKEN: ""
