tests:
  image:
    repository: web3f/monitoring-platform-e2e
    tag: latest
    pullPolicy: IfNotPresent
  config:
    timeoutSeconds: 120
    api:
      url: http://mp-api:3000
      incident:
        handlerType: "TransferEgress"
    chain:
      url: http://mp-chain:3000
      targetBlock: 25700136
    matrix:
      homeserver: https://matrix.web3.foundation
      roomId: "!BabNKVNdOktKGafXzd:web3.foundation"
      userId: "@mpbot:web3.foundation"
      # password is provided via MATRIX_PASSWORD environment variable
      messagePattern: "sent 11.8985 DOT"

# Secrets configuration
secrets:
  GITLAB_TOKEN: ""
  MATRIX_PASSWORD: ""

postgresql:
  auth:
    enablePostgresUser: true
    postgresPassword: "postgres"
    database: "monitoring"
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

mp-api:
  image:
    repository: web3f/monitoring-platform
    tag: latest
  config:
    database:
      host: postgresql
      port: 5432
      username: postgres
      password: postgres
      database: monitoring
    notificationApi:
      matrix:
        url: http://mp-matrix:3000/notifications
    monitoringConfigSources:
      - name: gitlab
        # E2E Test project
        url: "https://gitlab.w3f.tech/api/v4/projects/101/repository/files/accounts.yaml/raw?ref=main"
        # authToken is provided via GITLAB_TOKEN environment variable
    environment: test
    logging:
      level: debug

mp-chain:
  image:
    repository: web3f/monitoring-platform
    tag: latest
  config:
    chain: Polkadot
    # Event is at block 25700136, we need this time to run test hook and connect to matrix
    startBlock: 25700050
    monitoringGroupIds:
      - test-group-finance-1
    rpc: 
      url: wss://rpc-polkadot.luckyfriday.io
    monitoringApi:
      baseUrl: http://mp-api:3000
      endpoints:
        createIncident: /incidents
        resolveIncident: /incidents/resolve
        getConfig: /monitoring-config/groups
    environment: test
    logging:
      level: debug

mp-matrix:
  image:
    repository: web3f/monitoring-platform
    tag: latest
  config:
    matrix:
      url: "https://matrix.web3.foundation"
      userId: "@mpbot:web3.foundation"
      # password is provided via MATRIX_PASSWORD environment variable
      rooms:
        # TestMonitoringPlatform room
        - id: "!BabNKVNdOktKGafXzd:web3.foundation"
      logging:
        level: warn
    monitoringApi:
      baseUrl: "http://mp-api:3000"
      endpoints:
        getIncidents: "/incidents"
        getIncident: "/incidents/:id"
        acknowledgeIncident: "/incidents/:id/acknowledge"
    environment: test
    logging:
      level: debug

