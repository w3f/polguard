# ──────────────────────────────────────────────────────────────────────────────
#  GitHub Actions pipeline for "polguard"
#
#  Trust-separated:
#   • PRs                ⇒ code-quality only. E2E can be run manually via
#                          workflow_dispatch (hermetic: build → kind load →
#                          test, nothing is pushed) for pre-merge coverage.
#   • main (trusted)    ⇒ push :sha → e2e against that exact image → only then
#                          promote main/latest and publish the Helm chart.
#   • Release tags vX.Y.Z ⇒ retag the tested :sha → :vX.Y.Z + GitHub Release.
#
#  Shared e2e steps live in the reusable .github/workflows/e2e.yml.
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: web3f/polguard

jobs:
  code-quality:
    name: Code quality
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            e2e/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn test
      - run: yarn test:integration
        timeout-minutes: 5

  e2e-pr:
    name: E2E (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/e2e.yml
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
      MATRIX_DEVICE_ID: ${{ secrets.MATRIX_DEVICE_ID }}
      CONFIG_REPO_DEPLOY_KEY_BASE64: ${{ secrets.CONFIG_REPO_DEPLOY_KEY_BASE64 }}
    with:
      app-image-mode: local-build
      app-image: web3f/polguard
      app-tag: ${{ github.sha }}

  # Trusted main path: build & push the :sha artifact only. The moving tags
  # (main/latest) are pushed later by promote-main-image, after e2e passes.
  docker-build:
    name: Docker build & push
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  e2e-main:
    name: E2E (main)
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [docker-build]
    uses: ./.github/workflows/e2e.yml
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
      MATRIX_DEVICE_ID: ${{ secrets.MATRIX_DEVICE_ID }}
      CONFIG_REPO_DEPLOY_KEY_BASE64: ${{ secrets.CONFIG_REPO_DEPLOY_KEY_BASE64 }}
    with:
      app-image-mode: pull
      app-image: web3f/polguard
      app-tag: ${{ github.sha }}

  promote-main-image:
    name: Promote main image
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [e2e-main]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Promote SHA image to main and latest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${GITHUB_SHA}"

  publish-chart:
    name: Publish Helm chart
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [e2e-main]
    uses: w3f/helm-charts/.github/workflows/publish-chart.yml@master
    with:
      chart-path: deployment/chart
    secrets:
      HELM_CHARTS_TOKEN: ${{ secrets.HELM_CHARTS_TOKEN }}

  release-tag:
    name: Release tag
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Verify main SHA image exists
        run: docker manifest inspect "${IMAGE}:${GITHUB_SHA}"
      - name: Promote SHA image to release tag
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:${GITHUB_SHA}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes
