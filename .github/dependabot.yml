version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 = no version-update PRs. Security-update PRs are NOT limited by this
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "security"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
