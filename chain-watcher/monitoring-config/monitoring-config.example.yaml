version: 1.0

defaults:
  alerts:
    matrix:
      rooms:
        - "!xyz987:matrix.org"
      escalation:
        timeout: 60
        rooms:
          - "!xyz987:matrix.org"
  chains:
    - Polkadot
  monitors:
    - name: Governance

groups:
  - name: Example of using defaults
    # defaults: chains, monitors, alerts
    accounts:
      # name is optional, wallet address will be used if not provided
      - address: E8MByjWbS49hmzFM1U5rvFJES1Xgz1TSBAZLiYqZQiFTNUY
  
  - name: Kusama all the monitors
    chains:       # overwrites default
      - Kusama
    monitors:     # overwrites default
