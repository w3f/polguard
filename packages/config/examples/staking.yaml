defaults:
  notifications:
    messengerType: Matrix
    # Replace with a room your Matrix bot has joined. Format: !<roomId>:<homeserver>
    channels:
      - "!exampleRoomId:example.org"

groups:
  - id: active-set-presence-example
    chains:
      - AssetHubKusama
      - AssetHubPolkadot
    monitors:
      - name: Staking
        handlers:
          - ActiveSetPresenceState
          - OffenceReportedEvent
    # Claim staking rewards for these accounts (payouts service)
    operations:
      payout:
        signer: signer-x
    accountSetNames: [example-accounts]

accountSets:
  example-accounts:
    - name: example-validator
      address: "1i1vQ39YeQk4QiKF16wuA4neTuQfCRWwnwm7Xuk2yuQtd8Q"