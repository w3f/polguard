defaults:
  notifications:
    messengerType: matrix
    channels: ['!defaultroom:matrix.org']
    needsAck: true
    repeatHours: 24
  chains:
    - Polkadot
    - Kusama
  monitors:
    - name: Staking
      commission: 10
      handlers:
        - CommissionChanged
        - SlashReported

groups:
  - id: validators-default  # This group will be created for both Polkadot and Kusama
    accounts:
      - address: "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
        name: "Alice"
        selfStake: "5000.25"
      - address: "0xd43593c715fdd31c61141abd04a99fd6822c8558854ccde39a5684e7a56da27d"
        name: "Bob-Hex"
        commission: 5

  - id: validators-custom
    chains:
      - Kusama  # This group only for Kusama
    notifications:
      messengerType: matrix
      channels: ['!customroom:matrix.org']
      needsAck: false
      repeatHours: 12
    monitors:
      - name: Staking
        commission: 7
        handlers:
          - CommissionChanged
          - DestinationChanged
      - name: Balances
        threshold: "500.75"
        handlers:
          - BalanceThreshold
      - name: Identity
        handlers:
          - IdentityChanged
    accounts:
      - address: "HNZata7iMYWmk5RvZRTiAsSDhV8366zq2YGb3tLH5Upf74F"
        name: "Bob"
        # Staking settings
        commission: 3
        selfStake: "1000.5"
        # Identity settings
        matrix: "@validator:matrix.org"
        email: "validator@email.com"
        # Balances settings
        threshold: "750.25"
