accountSets:
  validators-default:
    - address: "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
      name: "Alice"
      selfStake: "5000.25"
    - address: "0xd43593c715fdd31c61141abd04a99fd6822c8558854ccde39a5684e7a56da27d"
      name: "Bob-Hex"
      commission: 5
      
  validators-custom:
    - address: "HNZata7iMYWmk5RvZRTiAsSDhV8366zq2YGb3tLH5Upf74F"
      name: "Bob"
      # Staking settings
      commission: 3
      selfStake: "1000.5"
      # Identity settings
      matrix: "@validator:matrix.org"
      email: "validator@email.com"
      # Balances settings
      threshold: "750.25"
      # Annotations
      annotations:
        tag: group-R

defaults:
  notifications:
    messengerType: Matrix
    channels: ['!defaultroom:matrix.org']
    needsAck: true
    repeatFiringMs: 3600
  chains:
    - Polkadot
    - Kusama
  monitors:
    - name: Staking
      commission: 10
      handlers:
        - CommissionChangedEvent
        - OffenceReportedEvent

groups:
  - id: validators-default  # This group will be created for both Polkadot and Kusama
    annotations:
      enablePayout: true
    accountSetNames: [validators-default]

  - id: validators-custom
    chains:
      - Kusama  # This group only for Kusama
    notifications:
      messengerType: Matrix
      channels: ['!customroom:matrix.org']
      needsAck: false
      repeatFiringMs: 3600
    monitors:
      - name: Staking
        commission: 7
        handlers:
          - CommissionChangedEvent
          - DestinationChangedCall
        annotations:
          tag: group-N
      - name: Balances
        threshold: "500.75"
        handlers:
          - BalanceThresholdState
      - name: Identity
        handlers:
          - IdentityChangedEvent
    accountSetNames: [validators-custom]
