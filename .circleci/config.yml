version: 2

jobs:

  yarnLint: &yarnLint
    docker:
      - image: web3f/node-dind:v3
    steps:
      - checkout
      - run:
          command: |
            cd "${MODULE}"
            yarn
            yarn lint     

  yarnLintChainWatcher:
    environment:
      MODULE: chain-watcher
    <<: *yarnLint

  yarnLintMatrix:
    environment:
      MODULE: matrix
    <<: *yarnLint

  helmLint: &helmLint
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - run:
          command: helm lint ./charts/"${MODULE}"

  helmLintChainWatcher:
    environment:
      MODULE: chain-watcher
    <<: *helmLint 

  helmLintMatrix:
    environment:
      MODULE: matrix
    <<: *helmLint          

  buildImage: &buildImage
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          command: |
            cd "${MODULE}"
            /scripts/build-image.sh web3f/mp-"${MODULE}" . 

  buildImageChainWatcher:
    environment:
      MODULE: chain-watcher
    <<: *buildImage

  buildImageMatrix:
    environment:
      MODULE: matrix
    <<: *buildImage

  integrationTests:
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - setup_remote_docker
      - run:
          description: run integration tests
          command: |
            /scripts/integration-tests.sh kindest/node:v1.23.4   

workflows:
  version: 2
  test_and_publish:
    jobs:
      # - yarnLintChainWatcher:
      #     filters:
      #       tags:
      #         only: /.*/
      # - yarnLintMatrix:
      #     filters:
      #       tags:
      #         only: /.*/  
      - helmLintChainWatcher:
          filters:
            tags:
              only: /.*/
      - helmLintMatrix:
          filters:
            tags:
              only: /.*/        
      - buildImageChainWatcher:
          context: dockerhub-bot
          requires:
            - helmLintChainWatcher
            # - yarnLintChainWatcher
          filters:
            tags:
              only: /.*/
      - buildImageMatrix:
          context: dockerhub-bot
          requires:
            - helmLintMatrix
            # - yarnLintMatrix
          filters:
            tags:
              only: /.*/
      - integrationTests:
          filters:
            tags:
              only: /.*/
          requires:
            - buildImageChainWatcher  
            - buildImageMatrix           