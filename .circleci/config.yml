version: 2

commit_filters: &commit_filters
  filters:
    tags:
      only: /.*/ 
release_filters: &release_filters
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/

defaults: &defaults
  docker:
    - image: web3f/ci-commons:v3

node_defaults: &node_defaults
  docker:
    - image: web3f/node-dind:v3

jobs:
  yarnLint: &yarnLint
    <<: *node_defaults
    steps:
      - checkout
      - run:
          command: |
            corepack enable && corepack prepare yarn@4.6.0 --activate
            yarn install
            yarn workspace @w3f/monitoring-${MODULE} lint     

  helmLint: &helmLint
    <<: *defaults
    steps:
      - checkout
      - run:
          command: helm lint ./deployment/charts/"${MODULE}"

  buildImage: &buildImage
    <<: *defaults
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          command: |
            /scripts/build-image.sh web3f/mp-"${MODULE}" . -f packages/"${MODULE}"/Dockerfile

  publishImage: &publishImage
    <<: *defaults
    steps:
      - checkout
      - setup_remote_docker
      - run:
          command: |
            /scripts/publish-image.sh web3f/mp-"${MODULE}"

  # Watcher jobs
  yarnLintWatcher: &watcher_job
    environment: &watcher_env
      MODULE: watcher
    <<: *yarnLint

  helmLintWatcher:
    environment: *watcher_env
    <<: *helmLint 

  buildImageWatcher:
    environment: *watcher_env
    <<: *buildImage

  publishImageWatcher:
    environment: *watcher_env
    <<: *publishImage 

  # Matrix jobs
  yarnLintMatrix: &matrix_job
    environment: &matrix_env
      MODULE: matrix
    <<: *yarnLint

  helmLintMatrix:
    environment: *matrix_env
    <<: *helmLint          

  buildImageMatrix:
    environment: *matrix_env
    <<: *buildImage

  publishImageMatrix:
    environment: *matrix_env
    <<: *publishImage                   

  integrationTests:
    <<: *defaults
    steps:
      - checkout
      - setup_remote_docker
      - run:
          description: run integration tests
          command: |
            /scripts/integration-tests.sh kindest/node:v1.23.4   

  publishCharts:
    <<: *defaults
    environment:
      HELM_CHARTS_SOURCE: /root/project/deployment/charts
    steps:
      - checkout
      - run:
          command: |
            /scripts/publish-chart.sh            

workflows:
  version: 2
  test_and_publish:
    jobs:
      # Lint jobs
      - yarnLintWatcher: &commit_job
          <<: *commit_filters
      - yarnLintMatrix: *commit_job
      - helmLintWatcher: *commit_job
      - helmLintMatrix: *commit_job     

      # Build jobs
      - buildImageWatcher: &build_job
          context: dockerhub-bot
          requires:
            - helmLintWatcher
            - yarnLintWatcher
          <<: *commit_filters
      - buildImageMatrix:
          <<: *build_job
          requires:
            - helmLintMatrix
            - yarnLintMatrix

      # Integration tests
      - integrationTests:
          context: ci-matrixbot
          <<: *commit_filters
          requires:
            - buildImageWatcher  
            - buildImageMatrix

      # Publish jobs
      - publishImageWatcher: &publish_job
          context: dockerhub-bot
          <<: *release_filters
          requires:
            - integrationTests
      - publishImageMatrix: *publish_job
      - publishCharts:
          context: github-bot
          <<: *release_filters
          requires:
            - integrationTests
