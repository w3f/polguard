version: 2

commit_filters: &commit_filters
  filters:
    tags:
      only: /.*/ 
release_filters: &release_filters
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/

jobs:
  yarnLint: &yarnLint
    docker:
      - image: web3f/node-dind:v3
    steps:
      - checkout
      - run:
          command: |
            corepack enable && corepack prepare yarn@4.6.0 --activate
            yarn install
            yarn workspace @w3f/monitoring-${MODULE} lint     

  yarnLintWatcher:
    environment:
      MODULE: watcher
    <<: *yarnLint

  yarnLintMatrix:
    environment:
      MODULE: matrix
    <<: *yarnLint

  helmLint: &helmLint
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - run:
          command: helm lint ./deployment/charts/"${MODULE}"

  helmLintWatcher:
    environment:
      MODULE: watcher
    <<: *helmLint 

  helmLintMatrix:
    environment:
      MODULE: matrix
    <<: *helmLint          

  buildImage: &buildImage
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          command: |
            /scripts/build-image.sh web3f/mp-"${MODULE}" . -f packages/"${MODULE}"/Dockerfile

  buildImageWatcher:
    environment:
      MODULE: watcher
    <<: *buildImage

  buildImageMatrix:
    environment:
      MODULE: matrix
    <<: *buildImage

  integrationTests:
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - setup_remote_docker
      - run:
          description: run integration tests
          command: |
            /scripts/integration-tests.sh kindest/node:v1.23.4   

  publishImage: &publishImage
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - setup_remote_docker
      - run:
          command: |
            /scripts/publish-image.sh web3f/mp-"${MODULE}"

  publishImageWatcher:
    environment:
      MODULE: watcher
    <<: *publishImage 

  publishImageMatrix:
    environment:
      MODULE: matrix
    <<: *publishImage            

  publishCharts:
    environment:
      HELM_CHARTS_SOURCE: /root/project/deployment/charts
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - run:
          command: |
            /scripts/publish-chart.sh            

workflows:
  version: 2
  test_and_publish:
    jobs:
      - yarnLintWatcher:
          <<: *commit_filters
      - yarnLintMatrix:
          <<: *commit_filters
      - helmLintWatcher:
          <<: *commit_filters
      - helmLintMatrix:
          <<: *commit_filters    
      - buildImageWatcher:
          context: dockerhub-bot
          requires:
            - helmLintWatcher
            - yarnLintWatcher
          <<: *commit_filters
      - buildImageMatrix:
          context: dockerhub-bot
          requires:
            - helmLintMatrix
            - yarnLintMatrix
          <<: *commit_filters
      - integrationTests:
          context: ci-matrixbot
          <<: *commit_filters
          requires:
            - buildImageWatcher  
            - buildImageMatrix
      - publishImageWatcher:
          context: dockerhub-bot
          <<: *release_filters
          requires:
            - integrationTests
      - publishImageMatrix:
          context: dockerhub-bot
          <<: *release_filters
          requires:
            - integrationTests      
      - publishCharts:
          context: github-bot
          <<: *release_filters
          requires:
            - integrationTests                 
