# ──────────────────────────────────────────────────────────────────────────────
#  CircleCI pipeline for “monitoring-platform”
#
#  • JS ⇒ build / lint / tests
#  • Docker ⇒ build & push images (SHA on every commit; master → master + latest)
#  • KinD e2e ⇒ runs in a *machine* executor so Docker, kubectl and KinD share
#    the same network namespace (avoids “connection refused” on 127.0.0.1)
#  • Release tags vX.Y.Z ⇒ retag image + publish Helm charts
# ──────────────────────────────────────────────────────────────────────────────
version: 2.1

orbs:
  docker: circleci/docker@2.8.2
  node:   circleci/node@5.2.0

executors:
  node:
    docker:
      - image: cimg/node:lts
    working_directory: ~/project

# Re-usable commands
commands:
  docker_login:
    steps:
      - run:
          name: Docker login
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

# Jobs
jobs:
  code_quality:
    executor: node
    steps:
      - checkout
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn test
      - run: yarn test:integration
      - persist_to_workspace:
          root: .
          paths: .

  docker_build:
    executor: node
    steps:
      - attach_workspace:
          at: ~/project
      - docker_login
      - setup_remote_docker:
          docker_layer_caching: true
      - docker/build:
          image: web3f/monitoring-platform
          tag: ${CIRCLE_SHA1}
      - docker/push:
          image: web3f/monitoring-platform
          tag: ${CIRCLE_SHA1}
      - when:
          condition:
            equal: ["master", "${CIRCLE_BRANCH}"]
          steps:
            - run:
                name: Tag master & latest
                command: |
                  for t in master latest; do
                    docker tag web3f/monitoring-platform:${CIRCLE_SHA1} web3f/monitoring-platform:$t
                    docker push web3f/monitoring-platform:$t
                  done

  end_to_end_tests:
    machine: true
    steps:
      - attach_workspace:
          at: ~/project
      - docker_login

      - run:
          name: Pull app image from registry
          command: docker pull web3f/monitoring-platform:${CIRCLE_SHA1}

      - run:
          name: Install kube tools
          command: |
            mkdir -p ~/.local/bin
            export PATH=$HOME/.local/bin:$PATH
            [ -x ~/.local/bin/kubectl ] || {
              curl -sSL -o kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
              install -m 0755 kubectl ~/.local/bin
            }
            [ -x ~/.local/bin/helm ] || {
              curl -sSL https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz | tar -xz
              install -m 0755 linux-amd64/helm ~/.local/bin/helm
            }
            [ -x ~/.local/bin/kind ] || {
              curl -sSL -o kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
              install -m 0755 kind ~/.local/bin/kind
            }
            # make PATH stick for all following steps
            echo "export PATH=$HOME/.local/bin:\$PATH" >> $BASH_ENV
      
      - run:
          name: Add Helm chart repos
          command: |
            helm repo add bitnami https://charts.bitnami.com/bitnami
            helm repo update

      - run:
          name: Build E2E runner image
          command: |
            docker build -t web3f/monitoring-platform-e2e:${CIRCLE_SHA1} -f e2e/Dockerfile .
            docker push web3f/monitoring-platform-e2e:${CIRCLE_SHA1}

      - run:
          name: Create KinD cluster
          command: |
            RELEASE="e2e-${CIRCLE_WORKFLOW_JOB_ID:0:6}"
            echo "export RELEASE=$RELEASE" >> $BASH_ENV

            kind create cluster --name=ci \
              --image kindest/node:v1.30.0 \
              --wait 120s

            kind load docker-image web3f/monitoring-platform:${CIRCLE_SHA1} --name=ci
            kind load docker-image web3f/monitoring-platform-e2e:${CIRCLE_SHA1} --name=ci
      
      - run:
          name: Update and build Helm chart dependencies
          command: |
            helm dependency update deployment/chart
            helm dependency update e2e/chart
            helm dependency build deployment/chart
            helm dependency build e2e/chart
      
      - run:
          name: Lint e2e chart
          command: helm lint e2e/chart

      - run:
          name: Install e2e chart
          command: |
            kubectl create ns e2e
            helm upgrade --install $RELEASE ./e2e/chart \
              -n e2e --create-namespace \
              --set tests.image.repository=web3f/monitoring-platform-e2e \
              --set tests.image.tag=${CIRCLE_SHA1} \
              --set api.image.tag=${CIRCLE_SHA1} \
              --set api.fullnameOverride="api" \
              --set chain.image.tag=${CIRCLE_SHA1} \
              --set chain.fullnameOverride="chain" \
              --set matrix.image.tag=${CIRCLE_SHA1} \
              --set matrix.fullnameOverride="matrix" \
              --set matrix.secrets.MATRIX_TOKEN=$MATRIX_TOKEN \
              --set api.secrets.GITLAB_TOKEN=$GITLAB_TOKEN \
              --set secrets.MATRIX_TOKEN=$MATRIX_TOKEN \
              --wait

      - run:
          name: Execute E2E tests
          command: helm test $RELEASE -n e2e
          no_output_timeout: 10m

      - run:
          name: Dump logs on failure
          when: on_fail
          command: |
            kubectl -n e2e get pods -o wide
            kubectl -n e2e logs --all-containers -l app.kubernetes.io/instance=$RELEASE || true

  release_tag:
    machine: true
    environment:
      IMAGE: web3f/monitoring-platform

    steps:
      - docker_login
      - run:
          name: Pull, retag & push release image
          command: |
            docker pull "${IMAGE}:${CIRCLE_SHA1}"
            docker tag  "${IMAGE}:${CIRCLE_SHA1}" "${IMAGE}:${CIRCLE_TAG}"
            docker push "${IMAGE}:${CIRCLE_TAG}"

  publish_charts:
    docker:
      - image: alpine/helm:3.17.3
    steps:
      - checkout
      - run:
          name: Install git & ca-certificates
          command: |
            apk update && \
            apk add --no-cache git ca-certificates
      - run:
          name: Publish Helm chart
          command: |
            chmod +x deployment/publish-chart.sh
            ./deployment/publish-chart.sh w3f/helm-charts


# Workflow
workflows:
  test_and_publish:
    jobs:
      - code_quality
      - docker_build:
          context: dockerhub-bot
          requires: [code_quality]
      - end_to_end_tests:
          context:
            - ci-matrixbot
            - dockerhub-bot
          requires: [docker_build]
      - release_tag:
          context: dockerhub-bot
          filters:
            branches: {ignore: /.*/}
            tags:     {only: /^v\d+\.\d+\.\d+$/}
      
      # TODO: It's not yet clear how we'll handle CD for prod, but we don't need to publish 
      # the chart every release as it works for the rest of services

      - publish_charts:
          context: github-bot
          filters:
            branches: {ignore: /.*/}
            tags:     {only: /^v\d+\.\d+\.\d+$/}
