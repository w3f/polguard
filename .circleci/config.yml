# ──────────────────────────────────────────────────────────────────────────────
#  CircleCI pipeline for "polguard"
#
#  • JS ⇒ build / lint / tests
#  • Docker ⇒ build & push images (SHA on every commit; master → master + latest)
#  • KinD e2e ⇒ runs in a *machine* executor so Docker, kubectl and KinD share
#    the same network namespace (avoids “connection refused” on 127.0.0.1)
#  • Release tags vX.Y.Z ⇒ retag image + publish Helm charts
# ──────────────────────────────────────────────────────────────────────────────
version: 2.1

orbs:
  docker: circleci/docker@2.8.2
  node:   circleci/node@5.2.0

executors:
  node:
    docker:
      - image: cimg/node:22.22
    working_directory: ~/project
  node-machine:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/project

commands:
  docker_login:
    steps:
      - run:
          name: Docker login
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

jobs:
  code_quality:
    executor: node-machine
    steps:
      - checkout
      - run:
          name: Install Node.js 22
          command: |
            source /opt/circleci/.nvm/nvm.sh
            nvm install 22
            nvm alias default 22
            echo 'source /opt/circleci/.nvm/nvm.sh' >> $BASH_ENV
            echo 'nvm use 22' >> $BASH_ENV
      - run:
          name: Enable Corepack (Yarn 4)
          command: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn test
      - run: yarn test:integration

  docker_build:
    executor: node
    steps:
      - checkout
      - docker_login
      - setup_remote_docker:
          docker_layer_caching: true
      - docker/build:
          image: web3f/polguard
          tag: ${CIRCLE_SHA1}
      - docker/push:
          image: web3f/polguard
          tag: ${CIRCLE_SHA1}
      - when:
          condition:
            equal: ["master", "${CIRCLE_BRANCH}"]
          steps:
            - run:
                name: Tag master & latest
                command: |
                  for t in master latest; do
                    docker tag web3f/polguard:${CIRCLE_SHA1} web3f/polguard:$t
                    docker push web3f/polguard:$t
                  done

  end_to_end_tests:
    machine: true
    steps:
      - checkout
      - docker_login

      - run:
          name: Pull app image from registry
          command: docker pull web3f/polguard:${CIRCLE_SHA1}

      - run:
          name: Install kube tools
          command: |
            mkdir -p ~/.local/bin
            export PATH=$HOME/.local/bin:$PATH
            [ -x ~/.local/bin/kubectl ] || {
              curl -sSL -o kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
              install -m 0755 kubectl ~/.local/bin
            }
            [ -x ~/.local/bin/helm ] || {
              curl -sSL https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz | tar -xz
              install -m 0755 linux-amd64/helm ~/.local/bin/helm
            }
            [ -x ~/.local/bin/kind ] || {
              curl -sSL -o kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
              install -m 0755 kind ~/.local/bin/kind
            }
            # make PATH stick for all following steps
            echo "export PATH=$HOME/.local/bin:\$PATH" >> $BASH_ENV

      - run:
          name: Add Helm chart repos
          command: |
            helm repo add w3f https://w3f.github.io/helm-charts
            helm repo update
            helm repo list

      - run:
          name: Build E2E runner image
          command: |
            docker build -t web3f/polguard-e2e:${CIRCLE_SHA1} -f e2e/Dockerfile .
            docker push web3f/polguard-e2e:${CIRCLE_SHA1}

      - run:
          name: Create KinD cluster
          command: |
            RELEASE="e2e-${CIRCLE_WORKFLOW_JOB_ID:0:6}"
            echo "export RELEASE=$RELEASE" >> $BASH_ENV

            kind create cluster --name=ci \
              --image kindest/node:v1.30.0 \
              --wait 120s

            kind load docker-image web3f/polguard:${CIRCLE_SHA1} --name=ci
            kind load docker-image web3f/polguard-e2e:${CIRCLE_SHA1} --name=ci

      - run:
          name: Update and build Helm chart dependencies
          command: |
            helm dependency update deployment/chart
            helm dependency update e2e/chart
            helm dependency build deployment/chart
            helm dependency build e2e/chart

      - run:
          name: Lint e2e chart
          command: helm lint e2e/chart

      - run:
          name: Install e2e chart
          command: |
            echo "Now installing polguard with helm. This command will wait until all Pods, PVCs, Services, and minimum number of Pods of a Deployment, StatefulSet, or ReplicaSet are in a ready state. If this command times out, check the status of esp. the Deployments and Pods."
            kubectl create ns e2e
            echo "$CONFIG_REPO_DEPLOY_KEY_BASE64" | tr -d '\n' > /tmp/deploy_key
            helm upgrade --install $RELEASE ./e2e/chart \
              -n e2e --create-namespace \
              --set tests.image.repository=web3f/polguard-e2e \
              --set tests.image.tag=${CIRCLE_SHA1} \
              --set tests.config.matrix.tokenAuth.deviceId=${MATRIX_DEVICE_ID} \
              --set polguard.image.tag=${CIRCLE_SHA1} \
              --set polguard.configFetcher.repos[0].name=stage \
              --set polguard.configFetcher.repos[0].url=git@github.com:w3f/monitoring-configs-stage.git \
              --set polguard.configFetcher.repos[0].ref=main \
              --set polguard.configFetcher.repos[0].sparseCheckout=/e2e/ \
              --set-file polguard.configFetcher.repos[0].sshPrivateKeyBase64=/tmp/deploy_key \
              --set polguard.matrixService.config.matrix.tokenAuth.deviceId=${MATRIX_DEVICE_ID} \
              --set polguard.matrixService.secrets.MATRIX_TOKEN=${MATRIX_TOKEN} \
              --set secrets.MATRIX_TOKEN=${MATRIX_TOKEN} \
              --wait
          no_output_timeout: 10m

      - run:
          name: Execute E2E tests
          command: helm test $RELEASE -n e2e
          no_output_timeout: 10m

      - run:
          name: Dump logs on failure
          when: on_fail
          command: |
            NS=e2e
            for comp in incident chain matrix postgresql; do
              echo "=== Logs for component=$comp ==="
              kubectl -n $NS logs \
                --selector app.kubernetes.io/component=$comp \
                --all-containers --tail=-1 || true
            done

            echo "=== Logs for test pod(s) ==="
            kubectl -n $NS logs \
              --selector app.kubernetes.io/component=test \
              --all-containers --tail=-1 || true

            echo "=== Pod status ==="
            kubectl -n $NS get pods -o wide

  release_tag:
    machine: true
    environment:
      IMAGE: web3f/polguard

    steps:
      - docker_login
      - run:
          name: Pull, retag & push release image
          command: |
            docker pull "${IMAGE}:${CIRCLE_SHA1}"
            docker tag  "${IMAGE}:${CIRCLE_SHA1}" "${IMAGE}:${CIRCLE_TAG}"
            docker push "${IMAGE}:${CIRCLE_TAG}"

  publish_charts:
    docker:
      - image: alpine/helm:3.17.3
    steps:
      - checkout
      - run:
          name: Install git & ca-certificates
          command: |
            apk update && \
            apk add --no-cache git ca-certificates
      - run:
          name: Publish Helm chart
          command: |
            chmod +x deployment/publish-chart.sh
            ./deployment/publish-chart.sh w3f/helm-charts

workflows:
  test_and_publish:
    jobs:
      - code_quality
      - docker_build:
          context: dockerhub-bot
      - end_to_end_tests:
          context:
            - ci-matrixbot
            - dockerhub-bot
          requires: [code_quality, docker_build]
      - release_tag:
          context: dockerhub-bot
          filters:
            branches: {ignore: /.*/}
            tags:     {only: /^v\d+\.\d+\.\d+$/}

      - publish_charts:
          context: github-bot
          filters:
            branches: {only: [ master ]}
