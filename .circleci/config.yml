version: 2

jobs:

  yarnLint: &yarnLint
    docker:
      - image: web3f/node-dind:v3
    steps:
      - checkout
      - run:
          command: |
            cd "${MODULE}"
            yarn
            yarn lint

  yarnLintTest:
    docker:
      - image: web3f/node-dind:v3
    steps:
      - checkout
      - run:
          command: |
            cd matrix
            yarn
            yarn lint          

  yarnLintChainWatcher:
    <<: *yarnLint
    steps:
      - run:
          command: |
            export DIRECTORY=chain-watcher
            ${JOB_NAME}

  yarnLintMatrix:
    environment:
      MODULE: matrix
    <<: *yarnLint

  helmLint:
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - run:
          command: helm lint ./charts/monitoring-platform

workflows:
  version: 2
  test_and_publish:
    jobs:
      - yarnLintChainWatcher:
          filters:
            tags:
              only: /.*/
      - yarnLintMatrix:
          filters:
            tags:
              only: /.*/  
      - helmLint:
          filters:
            tags:
              only: /.*/