version: 2.1

executors:
  default-executor:
    docker:
      - image: web3f/ci-commons:v3
  node-executor:
    docker:
      - image: web3f/node-dind:v3

jobs:
  yarn_lint:
    parameters:
      module:
        type: string
    executor: node-executor
    steps:
      - checkout
      - run:
          command: |
            corepack enable && corepack prepare yarn@4.6.0 --activate
            yarn install
            yarn workspace @w3f/monitoring-<< parameters.module >> lint

  helm_lint:
    parameters:
      module:
        type: string
    executor: default-executor
    steps:
      - checkout
      - run:
          command: helm lint ./deployment/charts/"<< parameters.module >>"

  build_image:
    parameters:
      module:
        type: string
    executor: default-executor
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          command: /scripts/build-image.sh web3f/mp-"<< parameters.module >>" . -f packages/"<< parameters.module >>"/Dockerfile

  publish_image:
    parameters:
      module:
        type: string
    executor: default-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          command: /scripts/publish-image.sh web3f/mp-"<< parameters.module >>"

  integration_tests:
    executor: default-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          description: run integration tests
          command: /scripts/integration-tests.sh kindest/node:v1.23.4

  publish_charts:
    executor: default-executor
    environment:
      HELM_CHARTS_SOURCE: /root/project/deployment/charts
    steps:
      - checkout
      - run:
          command: /scripts/publish-chart.sh

filters:
  all_tags: &all_tags
    tags:
      only: /.*/
  release_tags: &release_tags
    branches:
      ignore: /.*/
    tags:
      only: /^v\d+\.\d+\.\d+.*/

workflows:
  test_and_publish:
    jobs:
      # Yarn lint jobs for all modules
      - yarn_lint:
          name: yarn-lint-<< matrix.module >>
          matrix:
            parameters:
              module: ["api", "chain", "telemetry", "matrix"]
          filters: *all_tags

      # Helm lint jobs for all modules
      - helm_lint:
          name: helm-lint-<< matrix.module >>
          matrix:
            parameters:
              module: ["api", "chain", "telemetry", "matrix"]
          filters: *all_tags

      # Build jobs for all modules
      - build_image:
          name: build-<< matrix.module >>
          context: dockerhub-bot
          matrix:
            parameters:
              module: ["api", "chain", "telemetry", "matrix"]
          requires:
            - yarn-lint-api
            - yarn-lint-chain
            - yarn-lint-telemetry
            - yarn-lint-matrix
            - helm-lint-api
            - helm-lint-chain
            - helm-lint-telemetry
            - helm-lint-matrix
          filters: *all_tags

      # Integration tests
      - integration_tests:
          context: ci-matrixbot
          requires:
            - build-api
            - build-chain
            - build-telemetry
            - build-matrix
          filters: *all_tags

      # Publish jobs for all modules
      - publish_image:
          name: publish-<< matrix.module >>
          context: dockerhub-bot
          matrix:
            parameters:
              module: ["api", "chain", "telemetry", "matrix"]
          requires:
            - integration_tests
          filters: *release_tags

      # Publish charts
      - publish_charts:
          context: github-bot
          requires:
            - integration_tests
          filters: *release_tags
