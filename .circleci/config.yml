version: 2

commit_filters: &commit_filters
  filters:
    tags:
      only: /.*/ 
release_filters: &release_filters
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/

jobs:
  yarnLint: &yarnLint
    docker:
      - image: web3f/node-dind:v3
    steps:
      - checkout
      - run:
          command: |
            cd packages/"${MODULE}"
            yarn
            yarn lint     

  yarnLintChainWatcher:
    environment:
      MODULE: chain-watcher
    <<: *yarnLint

  yarnLintMatrix:
    environment:
      MODULE: matrix
    <<: *yarnLint

  helmLint: &helmLint
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - run:
          command: helm lint ./deployment/charts/"${MODULE}"

  helmLintChainWatcher:
    environment:
      MODULE: chain-watcher
    <<: *helmLint 

  helmLintMatrix:
    environment:
      MODULE: matrix
    <<: *helmLint          

  buildImage: &buildImage
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          command: |
            cd packages/"${MODULE}"
            /scripts/build-image.sh web3f/mp-"${MODULE}" . 

  buildImageChainWatcher:
    environment:
      MODULE: chain-watcher
    <<: *buildImage

  buildImageMatrix:
    environment:
      MODULE: matrix
    <<: *buildImage

  integrationTests:
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - setup_remote_docker
      - run:
          description: run integration tests
          command: |
            /scripts/integration-tests.sh kindest/node:v1.23.4   

  publishImage: &publishImage
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - setup_remote_docker
      - run:
          command: |
            /scripts/publish-image.sh web3f/mp-"${MODULE}"

  publishImageChainWatcher:
    environment:
      MODULE: chain-watcher
    <<: *publishImage 

  publishImageMatrix:
    environment:
      MODULE: matrix
    <<: *publishImage            

  publishCharts:
    environment:
      HELM_CHARTS_SOURCE: /root/project/deployment/charts
    docker:
      - image: web3f/ci-commons:v3
    steps:
      - checkout
      - run:
          command: |
            /scripts/publish-chart.sh            

workflows:
  version: 2
  test_and_publish:
    jobs:
      - yarnLintChainWatcher:
          <<: *commit_filters
      - yarnLintMatrix:
          <<: *commit_filters
      - helmLintChainWatcher:
          <<: *commit_filters
      - helmLintMatrix:
          <<: *commit_filters    
      - buildImageChainWatcher:
          context: dockerhub-bot
          requires:
            - helmLintChainWatcher
            - yarnLintChainWatcher
          <<: *commit_filters
      - buildImageMatrix:
          context: dockerhub-bot
          requires:
            - helmLintMatrix
            - yarnLintMatrix
          <<: *commit_filters
      - integrationTests:
          context: ci-matrixbot
          <<: *commit_filters
          requires:
            - buildImageChainWatcher  
            - buildImageMatrix
      - publishImageChainWatcher:
          context: dockerhub-bot
          <<: *release_filters
          requires:
            - integrationTests
      - publishImageMatrix:
          context: dockerhub-bot
          <<: *release_filters
          requires:
            - integrationTests      
      - publishCharts:
          context: github-bot
          <<: *release_filters
          requires:
            - integrationTests                 
